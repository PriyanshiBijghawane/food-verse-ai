services:
  - type: web
    name: food-verse-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: python -m pip install --no-cache-dir -r requirements-render.txt && python verify_render_install.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.10
